name: Compilar APK

# Se ejecuta solo: en cada push a main y cuando lo lanzas a mano desde la
# pestaña "Actions" de GitHub (botón "Run workflow"), útil si quieres un APK
# nuevo sin haber cambiado código. No hace falta Android Studio ni un PC:
# GitHub compila en su propia máquina y deja el APK listo para descargar.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # "secrets" no se puede usar directamente en un "if:" de step (GitHub
      # Actions lo prohíbe), así que lo volcamos primero a una variable de
      # entorno del job y comprobamos esa variable en los "if:" de abajo.
      HAS_RELEASE_SIGNING: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x gradlew

      - name: Compilar APK de depuración (instalable directamente)
        run: ./gradlew assembleDebug --no-daemon

      - name: Guardar el APK como artefacto de esta ejecución
        uses: actions/upload-artifact@v4
        with:
          name: mi-radio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar el APK en una "Release" de descarga directa
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Última compilación (debug)
          body: |
            APK de depuración generado automáticamente desde el commit
            ${{ github.sha }}. Descárgalo directamente en tu móvil desde
            esta página (no hace falta descomprimir nada) y ábrelo para
            instalarlo.
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # El APK release firmado solo se genera si el repo tiene configurado
      # el secret RELEASE_KEYSTORE_BASE64 (Settings > Secrets and variables
      # > Actions). Sin ese secret, este paso y los siguientes se saltan y
      # el workflow sigue publicando únicamente el debug de siempre.
      - name: Preparar el keystore de release desde el secret
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/radio-dari-release.keystore"

      - name: Compilar APK de release (firmado)
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        run: ./gradlew assembleRelease --no-daemon
        env:
          RELEASE_KEYSTORE_PATH: ${{ format('{0}/radio-dari-release.keystore', runner.temp) }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Guardar el APK de release como artefacto de esta ejecución
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: mi-radio-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publicar el APK de release en una "Release" de descarga directa
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-release
          name: Última compilación (firmada)
          body: |
            APK release firmado con la clave propia de Radio Dari, generado
            automáticamente desde el commit ${{ github.sha }}. Este APK
            usa un paquete distinto al debug (com.miradio.app en vez de
            com.miradio.app.debug), así que la primera vez hay que
            desinstalar la versión debug antes de instalar esta.
          prerelease: false
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
